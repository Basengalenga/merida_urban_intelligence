services:
  db:
    image: postgis/postgis:16-3.4
    container_name: yucatan_dw
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: yucatan_dw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d yucatan_dw"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: